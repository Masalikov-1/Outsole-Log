name: Bootstrap Flutter

on:
  workflow_dispatch:

jobs:
  bootstrap:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Prepare Android project
  run: |
    cp -r lib /tmp/outsole_lib
    cp -r test /tmp/outsole_test
    cp pubspec.yaml /tmp/outsole_pubspec.yaml

    flutter create \
      --platforms=android \
      --org=com.masalikov \
      --project-name=outsole_log \
      .

    rm -rf lib test
    cp -r /tmp/outsole_lib lib
    cp -r /tmp/outsole_test test
    cp /tmp/outsole_pubspec.yaml pubspec.yaml

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: outsole-log-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk